name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: BackupManager-windows-x64.zip
            installer: packaging/BackupManager-Setup.exe
          - rid: linux-x64
            artifact: BackupManager-linux-x64.tar.gz
            installer: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BackupManager.csproj

      - name: Publish (self-contained, ${{ matrix.rid }})
        run: >
          dotnet publish BackupManager.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -o ./publish

      - name: Install NSIS and zip
        if: matrix.rid == 'win-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis zip

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        run: makensis -DPUBLISH_DIR="$PWD/publish/win-x64" packaging/installer.nsi

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        run: cd publish && zip -r "../${{ matrix.artifact }}" . && cd ..

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: tar -czf "${{ matrix.artifact }}" -C ./publish .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.rid == 'win-x64' && 'BackupManager-windows-x64.zip,packaging/BackupManager-Setup.exe' || 'BackupManager-linux-x64.tar.gz' }}
          generate_release_notes: true
