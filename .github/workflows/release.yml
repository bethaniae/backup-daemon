name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows release
    runs-on: windows-2019 # Same platform as the original release pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BackupManager.csproj

      - name: Publish (self-contained, Windows x64)
        run: >
          dotnet publish BackupManager.csproj -c Release -r win-x64
          --self-contained -o ./publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath BackupManager-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: BackupManager-windows-x64.zip
          generate_release_notes: true
